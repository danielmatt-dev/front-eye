<!-- 
  access.component.html

  @description
  Pantalla de "Acceso denegado" que se muestra cuando un usuario
  intenta entrar a un recurso para el cual no tiene permisos.

  Incluye:
  - Icono central de candado.
  - Mensaje de título y subtítulo traducidos con ngx-translate.
  - Imagen ilustrativa de acceso denegado.
  - Botón para regresar al inicio (ruta "/").

  @remarks
  Utiliza estilos responsivos con Tailwind CSS y componentes de PrimeNG.
-->
<app-floating-configurator />
<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <!-- Contenedor principal con gradiente de fondo -->
        <div
            style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, rgba(51,54,128,0.4) 10%, rgba(247, 149, 48, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 flex flex-col items-center"
                style="border-radius: 53px">
                <div class="gap-4 flex flex-col items-center">
                    <!-- Icono de candado -->
                    <div class="flex justify-center items-center border-2 border-indigo-500 rounded-full"
                        style="width: 3.2rem; height: 3.2rem">
                        <i class="text-indigo-500 pi pi-fw pi-lock !text-2xl"></i>
                    </div>
                    <!-- Título de acceso denegado -->
                    <h1 class="text-surface-900 dark:text-surface-0 font-bold text-4xl lg:text-5xl mb-2">{{
                        'accessDenied.title' | translate }}</h1>
                    <!-- Mensaje secundario -->
                    <span class="text-muted-color mb-8">{{ 'accessDenied.message' | translate }}</span>
                    <!-- Imagen ilustrativa -->
                    <img ngSrc="assets/images/asset-access.svg" alt="Acceso denegado" width="400" height="300" />
                    <!-- Botón para regresar al inicio -->
                    <div class="col-span-12 text-center">
                        <p-button label="{{ 'accessDenied.button' | translate }}" routerLink="/"
                            [style]="{ background: '#6366E9', 'border-color': '#6366E9', color: 'white' }" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
