<div class="flex flex-col gap-8 mb-3">
    <div class="card p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="flex flex-col gap-2 w-full">
                <label for="1" class="font-bold">Afecciones</label>
                <p-select
                    id="1"
                    [(ngModel)]="afeccionSeleccionada"
                    [options]="afecciones"
                    class="w-full"
                ></p-select>
            </div>
            <div class="flex flex-col gap-2 w-full">
                <label for="2" class="font-bold">Resultados</label>
                <p-select
                    id="2"
                    [(ngModel)]="resultadoSeleccionado"
                    [options]="resultados"
                    class="w-full"
                ></p-select>
            </div>
            <div class="flex flex-col gap-2 w-full">
                <label for="dateRange2" class="font-bold">Rango de fechas</label>
                <p-calendar
                    id="dateRange2"
                    showIcon="true"
                    [(ngModel)]="fechasSeleccionadas"
                    selectionMode="range"
                    placeholder="Fechas"
                    class="w-full"
                    [style]="{ width: '100%' }"
                ></p-calendar>
            </div>
            <div class="flex flex-col justify-end">
                <p-button label="Consultar" class="w-full md:w-auto"/>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <h2 class="text-2xl font-bold">Reportes</h2>
    <p-table
        #dt1
        dataKey="id"
        [rows]="50"
        [loading]="false"
        [rowHover]="true"
        [paginator]="true"
        [globalFilterFields]="['']"
        responsiveLayout="scroll"
        (onRowSelect)="onRowSelect($event)"
        selectionMode="single">

        <ng-template pTemplate="caption">
            <div class="flex justify-between flex-col sm:flex-row items-center gap-4 w-full">
                <!-- Contenedor de botones alineados a la izquierda -->
                <div class="flex flex-col-375 sm:flex-row gap-2">
                    <p-button
                        label="Exportar a Excel"
                        icon="pi pi-file-excel"
                        severity="success"
                        outlined="true"
                        (click)="clear(dt1)"
                        (keydown)="onKeyDown($event)"
                        (keyup)="onKeyUp($event)"
                    ></p-button>

                    <p-button
                        label="Descargar en PDF"
                        severity="danger"
                        outlined="true"
                        icon="pi pi-file-pdf"
                    ></p-button>
                </div>

                <!-- Input de búsqueda alineado a la derecha -->
                <div class="relative w-full sm:w-64 lg:w-80">
                    <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                        <i class="pi pi-search text-gray-400"></i>
                    </div>
                    <input
                        pInputText
                        type="text"
                        #filter
                        (input)="onGlobalFilter(dt1, $event)"
                        placeholder="Buscar ..."
                        style="padding-left: 2rem;"
                        class="w-full sm:w-64 lg:w-80"
                    />
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th scope="col" style="min-width: 8rem">ID</th>
                <th scope="col" style="min-width: 8rem">Fecha</th>
                <th scope="col" style="min-width: 8rem">Hora</th>
                <th scope="col" style="min-width: 8rem">Edad</th>
                <th scope="col" style="min-width: 12rem">Afección</th>
                <th scope="col" style="min-width: 12rem">Ojo</th>
                <th scope="col" style="min-width: 12rem">Resultado</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-reporte>
            <tr [pSelectableRow]="reporte">
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="11">No se encontraron reportes</td>
            </tr>
        </ng-template>

        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="11">Cargando datos. Por favor espere.</td>
            </tr>
        </ng-template>

    </p-table>
</div>
