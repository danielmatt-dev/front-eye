<div class="card">
    <div class="flex flex-wrap items-center gap-12">
        <!-- Afecciones -->
        <div class="flex items-center gap-2">
            <label for="list1" class="font-bold">Afecciones</label>
            <p-dropdown
                id="list1"
                class="w-full"
                [(ngModel)]="afeccionSeleccionada"
                [options]="afecciones"
                placeholder="Todas"
            ></p-dropdown>
        </div>

        <!-- Resultados -->
        <div class="flex items-center gap-2">
            <label for="list2" class="font-bold">Resultados</label>
            <p-dropdown
                id="list2"
                class="w-full"
                [(ngModel)]="resultadoSeleccionado"
                [options]="resultados"
                placeholder="Todas"
            ></p-dropdown>
        </div>

        <!-- Fechas -->
        <div class="flex items-center gap-2">
            <label for="dateRange" class="font-bold">Rango de fechas</label>
            <p-calendar
                id="dateRange"
                showIcon="true"
                [(ngModel)]="fechasSeleccionadas"
                selectionMode="range"
                placeholder="Fechas"
                [translate]="true"
            ></p-calendar>
        </div>
        <div class="flex items-center gap-2">
            <p-button
                label="Consultar"
            />
        </div>
    </div>
</div>

<div class="card">
    <p-table
        #dt1
        dataKey="id"
        [rows]="50"
        [loading]="false"
        [rowHover]="true"
        [paginator]="true"
        [globalFilterFields]="['']"
        responsiveLayout="scroll"
        (onRowSelect)="onRowSelect($event)"
        selectionMode="single">

        <ng-template pTemplate="caption">
            <div class="flex justify-between items-center flex-wrap">
                <!-- Contenedor de botones alineados a la izquierda -->
                <div class="flex gap-2">
                    <p-button
                        label="Exportar a Excel"
                        icon="pi pi-file-excel"
                        severity="success"
                        outlined="true"
                        (click)="clear(dt1)"
                        (keydown)="onKeyDown($event)"
                        (keyup)="onKeyUp($event)"
                    ></p-button>

                    <p-button
                        label="Descargar en PDF"
                        severity="danger"
                        outlined="true"
                        icon="pi pi-file-pdf"
                    ></p-button>
                </div>

                <!-- Input de búsqueda alineado a la derecha -->
                <span class="p-input-icon-left flex items-center">
                    <i class="pi pi-search"></i>
                    <input
                        pInputText
                        type="text"
                        style="padding-left: 2rem"
                        #filter
                        (input)="onGlobalFilter(dt1, $event)"
                        placeholder="Buscar ..."
                        class="w-full"
                    />
                </span>

            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th scope="col" style="min-width: 8rem">ID</th>
                <th scope="col" style="min-width: 8rem">Fecha</th>
                <th scope="col" style="min-width: 8rem">Hora</th>
                <th scope="col" style="min-width: 8rem">Edad</th>
                <th scope="col" style="min-width: 12rem">Afección</th>
                <th scope="col" style="min-width: 12rem">Ojo</th>
                <th scope="col" style="min-width: 12rem">Resultado</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-reporte>
            <tr [pSelectableRow]="reporte">
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="11">No se encontraron reportes</td>
            </tr>
        </ng-template>

        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="11">Cargando datos. Por favor espere.</td>
            </tr>
        </ng-template>

    </p-table>
</div>
