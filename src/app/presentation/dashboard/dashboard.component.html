<!-- Tarjetas -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 xl:grid-cols-[1fr_1fr_0fr_0.2fr_1fr] gap-8">
    <!-- Detecciones -->
    <div class="col-span-1">
        <div class="card" style="padding: 1.5rem">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <div class="font-medium text-xl">Detecciones</div>
                </div>
                <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-400/10 rounded-full"
                     style="width: 2rem; height: 2rem">
                    <i class="pi pi-search text-blue-500 text-sm"></i>
                </div>
            </div>
            <div class="grid grid-cols-3">
                <div class="text-center">
                    <span class="text-2xl font-bold">17</span>
                    <div class="text-sm text-muted-color">Semana</div>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-bold">149</span>
                    <div class="text-sm text-muted-color">Mes</div>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-bold">2,058</span>
                    <div class="text-sm text-muted-color">Totales</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Por afección -->
    <div class="col-span-1 xl:col-span-2">
        <div class="card" style="padding: 1.5rem">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <div class="font-medium text-xl">Por afección</div>
                </div>
                <div class="flex items-center justify-center bg-orange-100 dark:bg-orange-400/10 rounded-full"
                     style="width: 2rem; height: 2rem">
                    <i class="pi pi-exclamation-triangle text-orange-500 text-sm"></i>
                </div>
            </div>
            <div class="grid grid-cols-3">
                <div class="text-center">
                    <span class="text-2xl font-bold">674</span>
                    <div class="text-sm text-muted-color">DMAE Seca</div>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-bold">238</span>
                    <div class="text-sm text-muted-color">DMAE Húmeda</div>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-bold">1,146</span>
                    <div class="text-sm text-muted-color">Ret. Diabética</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Por género -->
    <div class="col-span-1 lg:col-span-1">
        <div class="card" style="padding: 1.5rem">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <div class="font-medium text-xl">Por género</div>
                </div>
                <div class="flex items-center justify-center bg-cyan-100 dark:bg-cyan-400/10 rounded-full"
                     style="width: 2rem; height: 2rem">
                    <i class="pi pi-users text-cyan-500 text-sm"></i>
                </div>
            </div>
            <div class="flex justify-center items-end">
                <div class="text-center px-6">
                    <span class="text-2xl font-bold">74%</span>
                    <div class="text-sm text-muted-color">Hombres</div>
                </div>
                <div class="text-center px-6">
                    <span class="text-2xl font-bold">26%</span>
                    <div class="text-sm text-muted-color">Mujeres</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Rangos de edad -->
    <div class="col-span-1">
        <div class="card" style="padding: 1.5rem">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <div class="font-medium text-xl">Rangos de edad</div>
                </div>
                <div class="flex items-center justify-center bg-purple-100 dark:bg-purple-400/10 rounded-full"
                     style="width: 2rem; height: 2rem">
                    <i class="pi pi-user text-purple-500 text-sm"></i>
                </div>
            </div>
            <div class="grid grid-cols-3">
                <div class="text-center">
                    <span class="text-2xl font-bold">19%</span>
                    <div class="text-sm text-muted-color">Menos de 30</div>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-bold">37%</span>
                    <div class="text-sm text-muted-color">De 30 a 45</div>
                </div>
                <div class="text-center">
                    <span class="text-2xl font-bold">44%</span>
                    <div class="text-sm text-muted-color">Más de 45</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Gráficas de barra -->
<p-fluid class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-8">
    <div class="col-span-1">
        <div class="card">
            <div class="font-semibold text-xl mb-4">Detecciones por mes</div>
            <p-chart type="bar" [data]="barData1" [options]="barOptions1"></p-chart>
        </div>
    </div>
    <div class="col-span-1">
        <div class="card">
            <div class="font-semibold text-xl mb-4">Detecciones por rango de edad y afección</div>
            <p-chart type="bar" [data]="barData2" [options]="barOptions2"></p-chart>
        </div>
    </div>
</p-fluid>
